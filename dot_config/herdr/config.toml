onboarding = false

[theme]
name = "dracula"

# Inactive tab labels are near-illegible on a laptop screen. No tab-specific
# token exists (config check rejects tab_inactive_fg); overlay0 is the one that
# draws them, and it also draws sidebar titles (those stay bold).
[theme.custom]
overlay0 = "#dfe3f2"

[ui]
# Left panel closed on launch; set collapsed_mode = "hidden" for zero width.
sidebar_start_collapsed = true
# sidebar_collapsed_mode = "hidden"

# Default "" leaves pane apps with no right-click at all; ctrl+right-click now
# reaches editors/TUIs while plain right-click keeps herdr's pane menu.
# (shift is rejected as a modifier here.)
right_click_passthrough_modifier = "ctrl"

[advanced]
# tmux history-limit 1000000 equivalent (herdr counts bytes, not lines).
scrollback_limit_bytes = 100000000
